id: 14
name: event-sourcing-orders
program:
  id: backend-reliability-platform
  narrative_fit: Demonstrates event sourcing and CQRS patterns for order processing, proving auditability and throughput capabilities
  shared_assets:
    - gradle/libs.versions.toml
    - Dockerfile multi-stage pattern
    - benchmark JSON schema
status: benchmarked
claim: event sourcing e CQRS
stack:
  - java21
  - spring-boot
  - postgresql
  - redpanda
  - docker
language_profile:
  primary: spring-kotlin-backend
  secondary: []
  reason: Spring Boot with Java 21, using sealed interfaces and records for domain modeling
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: default-portfolio-project
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-executed
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: pending
  principles:
    coupling_rule: domain/use cases do not depend on framework, database, broker, cloud SDK, transport, or UI
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: in-memory event store avoids external DB dependency; benchmark runs standalone
    testability_rule: domain tests run without Spring context; use cases testable via plain OrderService + EventStore
    rejected_overengineering:
      - persistence/ database not required for demo; event store in memory suffices
      - redpanda/kafka not needed for single-JVM benchmark
  stack_profile: spring-kotlin-backend
  api_style: rest-http
  messaging: none
  cloud:
    mode: none
    local_provider: docker
    real_provider_target: none
    emulated_services: []
    adapter_rule: ports/adapters keep cloud SDK outside domain/use cases
    config_switch: CLOUD_PROVIDER=docker
    unsupported_behaviors: []
  database: none
  runtime: docker
  library_policy: Spring Boot 3.4 provides DI and REST; Jackson handles JSON without extra framework
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: PostgreSQL + Redpanda
      reason: Adds infrastructure complexity without improving benchmark claim; in-memory store keeps demo self-contained
architecture:
  style: cqrs-event-sourcing
  reason: Event sourcing captures every state change as an immutable event; CQRS separates write (commands) from read (projection)
  problem_forces:
    domain_complexity: low
    integration_pressure: low
    ui_state_complexity: none
    data_or_ml_reproducibility: low
    auditability: high
    throughput_or_async: low
    independent_deployability: low
  dependency_rule: domain -> application <- infrastructure (ports in domain, adapters in application)
  boundaries:
    - domain/ -- events, commands, aggregate, service (zero framework imports)
    - application/ -- event store, projection, controller (Spring-managed)
  rejected_alternatives:
    - style: layered
      reason: Event sourcing proof demands clear command/query separation; CQRS makes the claim directly visible
design_system:
  tokens: design-system/tokens.yaml
  readme_components:
    - readme_header
    - benchmark_card
    - architecture_card
    - references_table
  diagram_required: false
reuse:
  kit_version: local
  uses:
    - catalog
    - programs
    - proficiency-map
    - component-packs
    - openspec-schema
    - decision-brain
    - agent-graph
    - reuse-improvement-loop
    - architecture
    - language-profiles
    - design-system
    - sdd
    - harness
    - templates
    - skills
benchmark:
  primary_metric: events_per_second
  unit: unit
  command: docker run --rm event-sourcing-orders
  result_path: benchmarks/results/benchmark-20260720.json
  result:
    value: 776
    timestamp: "2026-07-20T21:01:32Z"
release:
  docker: built
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
