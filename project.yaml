manifest_version: 2
id: 14
name: event-sourcing-orders
program:
  id: backend-reliability-platform
  narrative_fit: Persistent order history connects payments, sagas, caching, and outbox delivery without sharing databases.
  shared_assets:
    - contracts/commerce-event-v1.schema.json
    - .portfolio/contracts/benchmark-result-v2.schema.json
    - Docker and Compose harness
status: benchmarked
claim: PostgreSQL append-only event sourcing with optimistic concurrency and durable CQRS rebuild
stack:
  - java21
  - spring-boot-3.4
  - spring-jdbc
  - postgresql-16.4
  - flyway-10.20
  - gradle-8.12
  - docker-compose
language_profile:
  primary: java
  secondary:
    - spring-kotlin-interoperability
  reason: Java 21 sealed interfaces and records demonstrate JVM interoperability with the Kotlin payments service.
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: default-portfolio-project
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-executed
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker-compose
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: complete
  principles:
    coupling_rule: Domain and use cases do not depend on Spring, JDBC, Flyway, PostgreSQL, HTTP, broker, or cloud SDK.
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: PostgreSQL is the only stateful runtime because durability is part of the claim.
    testability_rule: Domain tests are plain Java; real persistence tests run against an isolated Compose PostgreSQL service.
    rejected_overengineering:
      - Kafka and Redpanda are excluded because replay reads the event store and no publication claim is made.
      - An ORM is excluded so append concurrency and projection replacement remain explicit SQL.
      - A shared payments database is forbidden; integration uses the PaymentAuthorizer port.
  stack_profile: java
  api_style: rest-http
  messaging: none
  messaging_reason: Replay is an event-store concern; asynchronous delivery is owned by project 20.
  cloud:
    mode: none
    local_provider: docker-compose
    real_provider_target: managed-postgresql
    emulated_services: []
    adapter_rule: Database and HTTP configuration change at adapters, never in domain code.
    config_switch: DATABASE_URL and PAYMENTS_ADAPTER
    unsupported_behaviors:
      - multi-region replication
  database:
    engine: postgresql
    version: "16.4"
    purpose: append-only event history plus derived read model
  runtime: docker-compose
  library_policy: Spring JDBC exposes SQL invariants, Flyway owns schema history, and Jackson serializes sealed event payloads.
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: in-memory store
      reason: Cannot prove restart durability or persistent replay.
    - option: Redpanda or Kafka
      reason: Does not strengthen the event-store replay claim.
architecture:
  style: hexagonal-cqrs-event-sourcing
  reason: Event sourcing is the write model, CQRS is the derived read model, and hexagonal ports isolate persistence and payments.
  problem_forces:
    domain_complexity: medium
    integration_pressure: medium
    ui_state_complexity: none
    data_or_ml_reproducibility: low
    auditability: high
    throughput_or_async: medium
    independent_deployability: medium
  dependency_rule: infrastructure and input adapters depend inward on application/domain ports
  boundaries:
    - domain/ contains commands, sealed events, aggregate, service, and event-store port
    - application/ contains CQRS use case, read model, controller, and output ports
    - infrastructure/persistence contains JDBC adapters only
    - infrastructure/payment contains local and HTTP payment adapters
  integration_edges:
    - target: spring-hexagonal-payments
      protocol: HTTP POST /v1/payments
      idempotency_key: order:{orderId}:authorize:v1
      database_shared: false
    - target: outbox-pattern
      protocol: contracts/commerce-event-v1.schema.json
      status: contract-only until project 20 closes
design_system:
  tokens: .portfolio/design-system/tokens.yaml
  readme_components: [readme_header, benchmark_card, architecture_card, references_table]
  diagram_required: true
reuse:
  kit_version: local
  uses: [catalog, programs, component-packs, openspec-schema, decision-brain, agent-graph, reuse-improvement-loop, architecture, language-profiles, design-system, sdd, harness, templates, skills]
benchmark:
  schema_version: 2
  benchmark_id: postgres-append-rebuild
  primary_metric: append_throughput
  secondary_metric: projection_rebuild_latency
  command: powershell -NoProfile -ExecutionPolicy Bypass -File tools/benchmark.ps1
  result_path: benchmarks/results/event-sourcing-orders-v2.json
  workload:
    warmup_orders: 25
    measured_orders: 250
    events_per_order: 4
    repetitions: 3
    concurrency: 1
  result:
    append_throughput_median: 287.47
    append_throughput_unit: events/s
    projection_rebuild_median: 48.31
    projection_rebuild_unit: ms
    replayed_events_per_run: 1000
    failures: 0
release:
  docker: compose-verified
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
  push_requested: false
